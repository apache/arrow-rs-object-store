[package]
name = "object-store-reqwest-external-crypto"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
custom-http = []
custom-crypto = []
default = ["custom-crypto"]

[dependencies]
object_store = { path = "../../..", default-features = false, features = ["aws-base", "azure-base", "gcp-base", "http-base", "reqwest"] }
tokio = { version = "1", features = ["macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
hmac = "0.12"
